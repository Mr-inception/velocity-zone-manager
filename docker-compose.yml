services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity_pass
      POSTGRES_DB: velocity_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://velocity:velocity_pass@postgres:5432/velocity_db
      JWT_SECRET_KEY: dev-secret-change-me
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  pgdata: